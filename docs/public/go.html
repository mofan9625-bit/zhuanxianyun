<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全跳转中... | 机场专线云</title>
  <meta name="description" content="机场专线云官方安全跳转页面，正在为您安全重定向至第三方服务商官方网站。">
  <!-- 严格屏蔽所有搜索引擎爬虫抓取与收录本跳转页 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(59, 130, 246, 0.25);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --accent: #06b6d4;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, var(--bg) 80%);
      color: var(--text);
      padding: 20px;
    }
    .redirect-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px 32px;
      border-radius: 20px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(59, 130, 246, 0.15);
    }
    .spinner-box {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
    }
    .spinner-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--primary);
      border-right-color: var(--accent);
      animation: spin 1s linear infinite;
    }
    .spinner-core {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.6);
      animation: pulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .target-badge {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .manual-link {
      display: inline-block;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.88rem;
      border-bottom: 1px dashed rgba(56, 189, 248, 0.6);
      padding-bottom: 2px;
      transition: all 0.2s;
    }
    .manual-link:hover {
      color: #7dd3fc;
      border-bottom-style: solid;
    }
    .notice {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner-box">
      <div class="spinner-ring"></div>
      <div class="spinner-core"></div>
    </div>
    <div id="target-badge" class="target-badge">安全隔离通道</div>
    <h1 id="title">正在安全跳转至官网...</h1>
    <p class="desc" id="desc">您正在通过机场专线云的合规隔离中转通道访问服务商官网，页面即将自动加载。</p>
    <a id="manual-btn" class="manual-link" href="#" target="_blank" rel="nofollow sponsored noopener noreferrer">
      如未自动跳转，请点击此处手动前往 →
    </a>
    <p class="notice">
      [合规透明度披露] 本站部分外链包含推广返利，所得用于维持服务器租用及全自费网络测速开销。
    </p>
  </div>

  <script>
    (function() {
      // 官方 AFF 推广链接映射表
      const REDIRECT_MAP = {
        'yunjiexian': {
          name: '云界线 (Yunjiexian)',
          url: 'https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L'
        },
        'dalaoyun': {
          name: '大佬云 (DaLao Cloud)',
          url: 'https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V'
        },
        'huanqiuti': {
          name: '环球梯 (HuanQiu Ti)',
          url: 'https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU'
        },
        'liulian': {
          name: '榴莲云 (LiuLian Cloud)',
          url: 'https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR'
        },
        'liulianyun': {
          name: '榴莲云 (LiuLian Cloud)',
          url: 'https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR'
        },
        'shenxing': {
          name: '神行加速 (ShenXing Express)',
          url: 'https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK'
        },
        'shandianshu': {
          name: '闪电鼠 (ShanDian Shu)',
          url: 'https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg'
        }
      };

      // 解析当前请求的 ID 参数（支持 ?id=xxx、?aff=xxx 或 hash / path）
      const params = new URLSearchParams(window.location.search);
      let targetId = params.get('id') || params.get('aff') || params.get('target');

      if (!targetId && window.location.hash) {
        targetId = window.location.hash.replace(/^#/, '');
      }

      if (targetId) {
        targetId = targetId.toLowerCase().trim();
      }

      const item = targetId ? REDIRECT_MAP[targetId] : null;

      const titleEl = document.getElementById('title');
      const descEl = document.getElementById('desc');
      const badgeEl = document.getElementById('target-badge');
      const manualBtn = document.getElementById('manual-btn');

      if (item) {
        document.title = '正在前往 ' + item.name + ' 官网... | 机场专线云';
        badgeEl.textContent = '官方直达 · ' + item.name;
        titleEl.textContent = '正在前往 ' + item.name + '...';
        descEl.textContent = '已连接到 ' + item.name + ' 安全官方验证通道，正在为您完成跳转。';
        manualBtn.href = item.url;

        // 安全非保留跳转（不污染浏览器历史）
        setTimeout(function() {
          window.location.replace(item.url);
        }, 120);
      } else {
        document.title = '未识别的服务商 | 机场专线云';
        badgeEl.textContent = '重定向异常';
        titleEl.textContent = '未能识别目标服务商';
        descEl.textContent = '请求的跳转参数不存在或已失效，2 秒后将自动返回博客首页...';
        manualBtn.textContent = '点击返回机场专线云首页 →';
        manualBtn.href = '/';

        setTimeout(function() {
          window.location.replace('/');
        }, 2000);
      }
    })();
  </script>
</body>
</html>
