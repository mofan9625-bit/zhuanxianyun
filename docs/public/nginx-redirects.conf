    return 302 https://pygllc.speedworldaff.cc/#/?code=f3fRpBfX;
}

# 9. 边缘节点 (EdgeNova)
location = /go/bianyuan {
    return 302 https://wep.edgenovaaff.com/#/?code=nr2kdl68;
}

# 10. 快狸 (KuaiLi)
location = /go/kuaili {
    return 302 https://fanxiaobin.kuailiaff.com/#/?code=MOD3Jbg2;
}

# 11. 兜底与带参数规则：/go/ 未精确匹配路径重定向至 /go.html
location ^~ /go/ {
    rewrite ^/go/(.*)$ /go.html?id=$1 redirect;
}

# 12. 搜索引擎爬虫屏蔽头部保护
location = /go.html {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
}
