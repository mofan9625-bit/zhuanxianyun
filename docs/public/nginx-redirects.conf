# ==============================================================
# Nginx 301 隔离跳转配置规则（适用于 VPS / 宝塔面板）
# ==============================================================
# 使用方法：在站点 Nginx 虚拟主机的 server { ... } 配置块内引入：
# include /path/to/jichangzhuanxianyun.com/nginx-redirects.conf;
# ==============================================================

# 1. 云界线 (Yunjiexian)
location = /go/yunjiexian {
    return 301 https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L;
}

# 2. 大佬云 (DaLao Cloud)
location = /go/dalaoyun {
    return 301 https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V;
}

# 3. 环球梯 (HuanQiu Ti)
location = /go/huanqiuti {
    return 301 https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU;
}

# 4. 榴莲云 (LiuLian Cloud)
location = /go/liulian {
    return 301 https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR;
}
location = /go/liulianyun {
    return 301 https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR;
}

# 5. 神行加速 (ShenXing Express)
location = /go/shenxing {
    return 301 https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK;
}

# 6. 闪电鼠 (ShanDian Shu)
location = /go/shandianshu {
    return 301 https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg;
}

# 7. 兜底与带参数规则：/go/ 未精确匹配路径重定向至 /go.html
location ^~ /go/ {
    rewrite ^/go/(.*)$ /go.html?id=$1 redirect;
}

# 8. 搜索引擎爬虫屏蔽头部保护
location = /go.html {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
}
