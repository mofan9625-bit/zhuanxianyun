# ==============================================================
# Nginx 302 临时跳转配置规则（适用于 VPS / 宝塔面板）
# ==============================================================
# 使用方法：在站点 Nginx 虚拟主机的 server { ... } 配置块内引入：
# include /path/to/jichangzhuanxianyun.com/nginx-redirects.conf;
# ==============================================================

# 1. 云界线 (Yunjiexian)
location = /go/yunjiexian {
    return 302 https://lier01.yunjiexianaff.com/#/?code=xPthfI62;
}

# 2. 大佬云 (DaLao Cloud)
location = /go/dalaoyun {
    return 302 https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V;
